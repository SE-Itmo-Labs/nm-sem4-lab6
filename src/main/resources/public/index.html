<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная 6. ОДУ</title>
    <link rel="stylesheet" href="/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
</head>
<body>
    <div class="container">
        <div class="header-flex">
            <div class="header-text">
                <h1>Численное решение ОДУ</h1>
                <h2>Лабораторная работа №6</h2>
            </div>
            <div class="header-img">
                <video id="pirateVideo" class="header-video" muted playsinline loop autoplay>
                    <source src="/img/pirate.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="marquee-container">
            <marquee scrollamount="5">*** ДОБРО ПОЖАЛОВАТЬ В 6 ЛАБУ ПО ВЫЧМАТУ!!! УРА ОДУ!!! ***</marquee>
        </div>

        <div class="main-layout">

            <div class="input-panel">
                <div class="retro-form">
                    <h3 style="margin-top:0; color:var(--retro-primary);">Входные данные</h3>
                    <form id="dataForm">

                        <div class="form-group">
                            <label for="equationSelect">Уравнение y' = f(x, y):</label>
                            <select id="equationSelect" class="retro-select">
                                <option value="1">y' = x + y</option>
                                <option value="2">y' = y &minus; x</option>
                                <option value="3">y' = &minus;2xy</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label style="color: #000080; font-weight: bold;">Начальные условия:</label>
                            <div class="input-row">
                                <div>
                                    <label for="x0Input">x&#8320;:</label>
                                    <input type="text" id="x0Input" class="retro-input" value="0">
                                </div>
                                <div>
                                    <label for="y0Input">y&#8320; = y(x&#8320;):</label>
                                    <input type="text" id="y0Input" class="retro-input" value="1">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label style="color: #000080; font-weight: bold;">Интервал и параметры:</label>
                            <div class="input-row">
                                <div>
                                    <label for="xnInput">x&#8345; (конец):</label>
                                    <input type="text" id="xnInput" class="retro-input" value="2">
                                </div>
                                <div>
                                    <label for="hInput">Шаг h:</label>
                                    <input type="text" id="hInput" class="retro-input" value="0.1">
                                </div>
                            </div>
                            <div style="margin-top:10px; background: #ffffcc; padding: 10px; border: 1px inset #808080;">
                                <label for="epsInput" style="color: red;">Точность &epsilon;:</label>
                                <input type="text" id="epsInput" class="retro-input" value="0.0001">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="retro-btn retro-btn-primary">РАССЧИТАТЬ</button>
                            <button type="button" id="exportBtn" class="retro-btn retro-btn-secondary">Сохранить отчет</button>
                        </div>
                        <div id="formStatus" class="status-message"></div>
                    </form>
                </div>

                <div class="retro-form">
                    <h3 style="margin-top:0; color:var(--retro-primary);">Отображать:</h3>
                    <div id="chartCheckboxes" class="graph-controls">
                        <span style="font-size: 13px; color: #666;">Здесь появятся графики после расчета...</span>
                    </div>
                </div>

                <div id="accuracyResults" class="results-panel" style="display:none;"></div>
            </div>

            <div class="graph-panel">
                <h2 style="margin-top: 0;">График решения</h2>
                <div class="graph-box">
                    <canvas id="chartCanvas"></canvas>
                </div>

                <div id="solutionTablePanel" class="results-panel" style="display:none;">
                    <h3 style="color:var(--retro-primary); margin-top:0;">Таблица приближённых значений</h3>
                    <div style="overflow-x: auto; max-height: 400px;">
                        <table class="data-table" id="solutionTable">
                            <thead><tr id="solutionTableHead"></tr></thead>
                            <tbody id="solutionTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
